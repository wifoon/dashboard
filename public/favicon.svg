<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Tło - płynne przejście z ciemnoszarego do głębokiej czerni aplikacji -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    
    <!-- Akcent dla jasnego kafelka -->
    <linearGradient id="lightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
  </defs>

  <!-- Okrągła baza z delikatną szklaną ramką -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="31" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Minimalistyczny widok dashboardu -->
  <!-- Sidebar -->
  <rect x="16" y="18" width="8" height="28" rx="3" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Główny górny panel (akcent z Twojego koloru sukcesu) -->
  <rect x="28" y="18" width="20" height="12" rx="3" fill="#6BE3A4"/>

  <!-- Dolny lewy kafelek -->
  <rect x="28" y="34" width="8" height="12" rx="3" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Dolny prawy kafelek -->
  <rect x="40" y="34" width="8" height="12" rx="3" fill="url(#lightGrad)"/>
</svg>
